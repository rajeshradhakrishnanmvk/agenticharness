// Default configuration
const DEFAULT_OLLAMA_URL = "http://localhost:11434/api/chat";
const DEFAULT_MODEL = "deepseek-r1:8b";
const DEFAULT_RECORDS_PER_PAGE = 10;

// Settings storage key
const SETTINGS_STORAGE_KEY = 'ollama_app_settings';

// Load settings from localStorage or use defaults
function loadSettings() {
  const savedSettings = localStorage.getItem(SETTINGS_STORAGE_KEY);
  if (savedSettings) {
    try {
      return JSON.parse(savedSettings);
    } catch (e) {
      console.error('Failed to parse settings:', e);
    }
  }
  return {
    ollamaUrl: DEFAULT_OLLAMA_URL,
    model: DEFAULT_MODEL,
    recordsPerPage: DEFAULT_RECORDS_PER_PAGE
  };
}

// Save settings to localStorage
function saveSettings(settings) {
  localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(settings));
}

// Initialize settings
let currentSettings = loadSettings();
let OLLAMA_URL = currentSettings.ollamaUrl;
let MODEL = currentSettings.model;
let DEEPSEEK_API_KEY = currentSettings.apiKey || currentSettings.DEEPSEEK_API_KEY || "";

    try {
      switch (action) {
        case 'save':
          saveConversationHistory();
          return JSON.stringify({ success: true, action: 'save', message: "Conversation saved" });
        case 'load':
          const loaded = loadConversationHistory();
          return JSON.stringify({ success: loaded, action: 'load', message: loaded ? "History loaded" : "No history found" });

          clearConversationHistory();

          archiveConversation();

        default:
          return JSON.stringify({ success: false, error: `Unknown action: ${action}` });
      }
    } catch (error) {
      return JSON.stringify({ success: false, error: error.message });

  manage_cache: async ({ action }) => {
    if (typeof OllamaCache === 'undefined') {
      return JSON.stringify({ success: false, error: "OllamaCache not available" });

    try {
      switch (action) {
        case 'clear':
          await OllamaCache.clear();

        case 'init':
          await OllamaCache.initDB();

          try {
            await OllamaCache.initDB();

            return JSON.stringify({ success: false, message: "Cache not operational", error: error.message });

const LIKE_STORAGE_KEY = "ai_agentic_grid_likes";

// Load likes from localStorage
function loadLikes() {
  try {
    const saved = localStorage.getItem(LIKE_STORAGE_KEY);
    return saved ? JSON.parse(saved) : {};
  } catch (error) {
    console.error("Failed to load likes:", error);
    return {};
  }
}

// Save likes to localStorage
function saveLikes(likes) {
  try {
    localStorage.setItem(LIKE_STORAGE_KEY, JSON.stringify(likes));
  } catch (error) {
    console.error("Failed to save likes:", error);
  }
}

// Global likes object
let messageLikes = loadLikes();

// Create like buttons for a message
function createLikeButtons(messageElement, messageId) {
  const toggleBtn = document.createElement("button");
  toggleBtn.className = "like-toggle-btn";
  toggleBtn.innerHTML = '<span class="like-toggle-icon">▼</span> Reactions';

  const container = document.createElement("div");
  container.className = "like-button-container";

  const reactions = [
    { type: "thumbs-up", emoji: "👍", label: "Like" },
    { type: "heart", emoji: "❤️", label: "Love" },
    { type: "star", emoji: "⭐", label: "Star" },
    { type: "fire", emoji: "🔥", label: "Fire" },
    { type: "clap", emoji: "👏", label: "Clap" }
  ];

  reactions.forEach(reaction => {
    const button = document.createElement("button");
    button.className = `like-button like-${reaction.type}`;
    button.title = reaction.label;
    button.dataset.messageId = messageId;
    button.dataset.reactionType = reaction.type;

    const emoji = document.createElement("span");
    emoji.className = "like-emoji";
    emoji.textContent = reaction.emoji;

    const count = document.createElement("span");
    count.className = "like-count";

    // Load saved reaction count
    const savedCount = messageLikes[messageId]?.[reaction.type] || 0;
    count.textContent = savedCount > 0 ? savedCount : "";
    if (savedCount > 0) {
      button.classList.add("active");
    }

    button.appendChild(emoji);
    button.appendChild(count);

    button.addEventListener("click", () => handleLikeClick(button, messageId, reaction.type));

    container.appendChild(button);
  });

  toggleBtn.addEventListener("click", () => {
    const isCollapsed = container.classList.toggle("collapsed");
    toggleBtn.classList.toggle("collapsed");
    toggleBtn.innerHTML = isCollapsed
      ? '<span class="like-toggle-icon">▼</span> Reactions'
      : '<span class="like-toggle-icon">▼</span> Reactions';
  });

  messageElement.appendChild(toggleBtn);
  messageElement.appendChild(container);
}

// Handle like button click
function handleLikeClick(button, messageId, reactionType) {
  const countSpan = button.querySelector(".like-count");

  // Initialize message likes if not exists
  if (!messageLikes[messageId]) {
    messageLikes[messageId] = {};
  }

  // Toggle reaction
  const currentCount = messageLikes[messageId][reactionType] || 0;
  const isActive = button.classList.contains("active");

  if (isActive) {
    // Remove reaction
    messageLikes[messageId][reactionType] = Math.max(0, currentCount - 1);
    button.classList.remove("active");
    countSpan.textContent = messageLikes[messageId][reactionType] > 0 ? messageLikes[messageId][reactionType] : "";
  } else {
    // Add reaction
    messageLikes[messageId][reactionType] = currentCount + 1;
    button.classList.add("active");
    countSpan.textContent = messageLikes[messageId][reactionType];
  }

  // Save to localStorage
  saveLikes(messageLikes);

  console.log(`Reaction ${reactionType} for message ${messageId}:`, messageLikes[messageId][reactionType]);
}

// Generate unique message ID
function generateMessageId() {
  return `msg_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
}

// Reattach event listeners to like buttons (for loaded messages)
function reattachLikeButtonListeners(messageElement) {
  const likeButtons = messageElement.querySelectorAll('.like-button');
  likeButtons.forEach(button => {
    const messageId = button.dataset.messageId;
    const reactionType = button.dataset.reactionType;

    // Remove old listener if any and add new one
    const newButton = button.cloneNode(true);
    button.parentNode.replaceChild(newButton, button);

    newButton.addEventListener("click", () => handleLikeClick(newButton, messageId, reactionType));
  });

  const toggleBtn = messageElement.querySelector('.like-toggle-btn');
  if (toggleBtn) {
    const container = messageElement.querySelector('.like-button-container');
    const newToggleBtn = toggleBtn.cloneNode(true);
    toggleBtn.parentNode.replaceChild(newToggleBtn, toggleBtn);

    newToggleBtn.addEventListener("click", () => {
      const isCollapsed = container.classList.toggle("collapsed");
      newToggleBtn.classList.toggle("collapsed");
      newToggleBtn.innerHTML = isCollapsed
        ? '<span class="like-toggle-icon">▼</span> Reactions'
        : '<span class="like-toggle-icon">▼</span> Reactions';
    });
  }
}

let progressInterval = null;

function showProgress(message = "Loading...") {
  progressContainer.classList.add("active");
  progressText.classList.add("active");
  progressText.textContent = message;
  progressBar.style.width = "0%";

  // Simulate progress from 0% to 90% over time
  let progress = 0;
  clearInterval(progressInterval);

  progressInterval = setInterval(() => {
    progress += Math.random() * 15;
    if (progress > 90) {
      progress = 90;
      clearInterval(progressInterval);
    }
    progressBar.style.width = `${progress}%`;
  }, 500);
}

function updateProgress(percent, message) {
  if (message) {
    progressText.textContent = message;
  }
  progressBar.style.width = `${Math.min(percent, 100)}%`;
}

function hideProgress() {
  clearInterval(progressInterval);
  progressBar.style.width = "100%";

  setTimeout(() => {
    progressContainer.classList.remove("active");
    progressText.classList.remove("active");
    progressBar.style.width = "0%";
  }, 300);
}

/* ============================================================
   AGENT CONFIGURATION
============================================================ */

const STORAGE_KEY_AGENT_GLOBAL = "ai_agentic_grid_agent_global";
const STORAGE_KEY_CONVERSATION_CONFIG = "ai_agentic_grid_conversation_config";

// Default agent configuration
const defaultAgentConfig = {
  name: "Agentic Grid Assistant",
  soul: "You are a helpful, clear, and enthusiastic assistant. You explain concepts with patience and use examples to make things easier to understand.",
  systemInstructions: 'You are an AI assistant that can manage a dynamic data grid. You have access to tools for adding, deleting, updating, and sorting rows and columns. Always use the tools to perform actions on the grid when requested by the user.'
};

// Global agent configuration (applies to all conversations by default)
let globalAgentConfig = { ...defaultAgentConfig };

// Conversation-specific agent configuration (overrides global for this conversation)
let conversationAgentConfig = null; // null means use global

// Current active configuration (computed from global + conversation override)
let currentAgentConfig = { ...defaultAgentConfig };

// Get the active agent config (conversation-specific or global)
function getActiveAgentConfig() {
  return conversationAgentConfig || globalAgentConfig;
}

// Check if conversation has custom config
function hasConversationConfig() {
  return conversationAgentConfig !== null;
}

// Load global agent configuration from localStorage
function loadGlobalAgentConfig() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY_AGENT_GLOBAL);
    if (saved) {
      const config = JSON.parse(saved);
      globalAgentConfig = { ...defaultAgentConfig, ...config };
      console.log("✅ Global agent configuration loaded:", globalAgentConfig.name);
      return true;
    }
  } catch (error) {
    console.error("Failed to load global agent config:", error);
  }
  return false;
}

// Load conversation-specific agent configuration
function loadConversationAgentConfig() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY_CONVERSATION_CONFIG);
    if (saved) {
      const config = JSON.parse(saved);
      conversationAgentConfig = config;
      console.log("✅ Conversation-specific agent config loaded:", config.name);
      return true;
    }
  } catch (error) {
    console.error("Failed to load conversation config:", error);
  }
  conversationAgentConfig = null; // Use global
  return false;
}

// Load all agent configurations
function loadAgentConfig() {
  loadGlobalAgentConfig();
  loadConversationAgentConfig();
  currentAgentConfig = getActiveAgentConfig();
  return true;
}

// Save global agent configuration to localStorage
function saveGlobalAgentConfig(config) {
  try {
    globalAgentConfig = { ...config };
    localStorage.setItem(STORAGE_KEY_AGENT_GLOBAL, JSON.stringify(config));
    console.log("💾 Global agent configuration saved:", config.name);

    // If no conversation-specific config, update current
    if (!hasConversationConfig()) {
      currentAgentConfig = { ...config };
      updateAgentDisplay();
    }
    return true;
  } catch (error) {
    console.error("Failed to save global agent config:", error);
    return false;
  }
}

// Save conversation-specific agent configuration
function saveConversationAgentConfig(config) {
  try {
    conversationAgentConfig = { ...config };
    localStorage.setItem(STORAGE_KEY_CONVERSATION_CONFIG, JSON.stringify(config));
    console.log("💾 Conversation-specific agent config saved:", config.name);
    currentAgentConfig = { ...config };
    updateAgentDisplay();
    return true;
  } catch (error) {
    console.error("Failed to save conversation agent config:", error);
    return false;
  }
}

// Clear conversation-specific config (revert to global)
function clearConversationAgentConfig() {
  try {
    conversationAgentConfig = null;
    localStorage.removeItem(STORAGE_KEY_CONVERSATION_CONFIG);
    console.log("🔄 Reverted to global agent configuration");
    currentAgentConfig = { ...globalAgentConfig };
    updateAgentDisplay();
    return true;
  } catch (error) {
    console.error("Failed to clear conversation config:", error);
    return false;
  }
}

// Save agent configuration (determines scope automatically)
function saveAgentConfig(config, isConversationSpecific = true) {
  if (isConversationSpecific) {
    return saveConversationAgentConfig(config);
  } else {
    return saveGlobalAgentConfig(config);
  }
}

// Get combined system prompt (system instructions + soul)
function getCombinedSystemPrompt(includeToolInstructions = false) {
  const activeConfig = getActiveAgentConfig();

  // Safety check - if activeConfig is not initialized, use defaults
  if (!activeConfig) {
    return explanationSystemPrompt;
  }

  const soul = activeConfig.soul?.trim();
  const instructions = activeConfig.systemInstructions?.trim();

  let basePrompt;
  if (soul && instructions) {
    basePrompt = `${soul}\n\n${instructions}`;
  } else {
    basePrompt = instructions || soul || explanationSystemPrompt;
  }

  // Add tool instructions if requested (for tool mode)
  if (includeToolInstructions) {
    return `${basePrompt}\n\n${toolModeSystemPrompt}`;
  }

  return basePrompt;
}

// Update agent display in UI
function updateAgentDisplay() {
  const activeConfig = getActiveAgentConfig();
  const agentName = activeConfig.name || "AI Assistant";
  const agentNameDisplay = document.getElementById('agentNameDisplay');
  if (agentNameDisplay) {
    const scope = hasConversationConfig() ? "🔧" : "🌐";
    agentNameDisplay.textContent = `${scope} Agent: ${agentName}`;
    agentNameDisplay.title = hasConversationConfig() ?
      "Conversation-specific agent" : "Global agent (applies to all conversations)";
  }
  console.log("Current agent:", agentName, hasConversationConfig() ? "(Conversation)" : "(Global)");
}

/* ============================================================
   LOCAL STORAGE HISTORY
============================================================ */

const STORAGE_KEY = "ai_agentic_grid_current";
const STORAGE_KEY_ARCHIVE = "ai_agentic_grid_archive";
const MAX_HISTORY_ITEMS = 10; // Max archived conversations

/*
   Save conversation history to localStorage
*/
function saveConversationHistory() {
  try {
    showProgress("Saving conversation...");

    const history = {
      timestamp: new Date().toISOString(),
      conversationMemory: conversationMemory,
      conversationAgentConfig: conversationAgentConfig, // Save conversation-specific config (or null for global)
      chatMessages: []
    };

    // Extract chat messages from DOM (skip system message)
    const messageElements = chatContainer.querySelectorAll(".message");
    messageElements.forEach(msg => {
      // Skip system message - we save agent config separately
      if (msg.classList.contains("system")) return;

      const isUser = msg.classList.contains("user");
      history.chatMessages.push({
        role: isUser ? "user" : "assistant",
        content: msg.textContent,
        html: msg.innerHTML
      });
    });

    // Only save if there are actual messages
    if (history.chatMessages.length === 0) {
      console.log("No messages to save, skipping save");
      hideProgress();
      return;
    }

    // Save to current conversation slot
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    console.log("Conversation history saved:", history.chatMessages.length, "messages");

    hideProgress();
  } catch (error) {
    console.error("Failed to save conversation history:", error);
    hideProgress();
  }
}

/*
   Archive current conversation before starting a new one
*/
function archiveConversation() {
  try {
    showProgress("Archiving conversation...");

    const current = localStorage.getItem(STORAGE_KEY);
    if (!current) {
      console.log("No current conversation to archive");
      hideProgress();
      return;
    }

    // Get existing archive
    let archive = [];
    const savedArchive = localStorage.getItem(STORAGE_KEY_ARCHIVE);
    if (savedArchive) {
      archive = JSON.parse(savedArchive);
    }

    // Add current conversation to archive
    const currentHistory = JSON.parse(current);
    archive.unshift(currentHistory); // Add to beginning

    // Keep only MAX_HISTORY_ITEMS
    if (archive.length > MAX_HISTORY_ITEMS) {
      archive = archive.slice(0, MAX_HISTORY_ITEMS);
    }

    // Save archive
    localStorage.setItem(STORAGE_KEY_ARCHIVE, JSON.stringify(archive));
    console.log("Conversation archived:", currentHistory.timestamp);

    hideProgress();
  } catch (error) {
    console.error("Failed to archive conversation:", error);
    hideProgress();
  }
}

/*
   Load conversation history from localStorage
*/
function loadConversationHistory() {
  try {
    showProgress("Loading conversation...");

    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) {
      console.log("No conversation history found");
      hideProgress();
      return false;
    }

    const history = JSON.parse(saved);
    console.log("📦 Loading history:", {
      hasConversationMemory: !!history.conversationMemory,
      conversationMemoryLength: history.conversationMemory?.length,
      hasChatMessages: !!history.chatMessages,
      chatMessagesLength: history.chatMessages?.length
    });

    updateProgress(30, "Restoring conversation memory...");

    // Restore conversation-specific agent configuration (or null for global)
    if (history.hasOwnProperty('conversationAgentConfig')) {
      conversationAgentConfig = history.conversationAgentConfig;
      if (conversationAgentConfig) {
        console.log("✅ Restored conversation-specific agent config:", conversationAgentConfig.name);
      } else {
        console.log("✅ Conversation uses global agent config");
      }
    } else if (history.agentConfig) {
      // Legacy: old format had agentConfig, treat as conversation-specific
      conversationAgentConfig = { ...defaultAgentConfig, ...history.agentConfig };
      console.log("✅ Restored agent config (legacy):", conversationAgentConfig.name);
    }

    // Update current config and display
    currentAgentConfig = getActiveAgentConfig();
    updateAgentDisplay();

    // Save the restored conversation config
    if (conversationAgentConfig) {
      localStorage.setItem(STORAGE_KEY_CONVERSATION_CONFIG, JSON.stringify(conversationAgentConfig));
    } else {
      localStorage.removeItem(STORAGE_KEY_CONVERSATION_CONFIG);
    }

    // Restore conversation memory
    if (history.conversationMemory && Array.isArray(history.conversationMemory)) {
      // Update system prompt with restored agent config
      conversationMemory.length = 0;
      conversationMemory.push({
        role: "system",
        content: getCombinedSystemPrompt()
      });
      // Restore the rest
      history.conversationMemory.slice(1).forEach(msg => {
        conversationMemory.push(msg);
      });
      console.log("✅ Restored conversation memory:", conversationMemory.length, "messages");
    }

    updateProgress(60, "Restoring messages...");

    // Restore chat messages in UI
    if (history.chatMessages && Array.isArray(history.chatMessages)) {
      chatContainer.innerHTML = ""; // Clear existing messages

      // Add system message first
      addSystemMessageToChat();

      history.chatMessages.forEach(msg => {
        // Skip system messages from saved data (we already added it above)
        if (msg.role === 'system') return;

        const div = document.createElement("div");
        div.className = `message ${msg.role}`;
        div.innerHTML = msg.html;
        chatContainer.appendChild(div);

        // Reattach like button listeners for assistant messages
        if (msg.role === 'assistant') {
          reattachLikeButtonListeners(div);
        }
      });
      chatContainer.scrollTop = chatContainer.scrollHeight;
      console.log("✅ Restored UI messages:", history.chatMessages.length, "messages");
      console.log("✅ Chat container children:", chatContainer.children.length);
    }

    console.log("Conversation history loaded");
    hideProgress();
    return true;
  } catch (error) {
    console.error("Failed to load conversation history:", error);
    hideProgress();
    return false;
  }
}

/*
   Clear current conversation (but keep it in archive)
*/
function clearConversationHistory() {
  try {
    // Reset conversation memory (keep system prompt)
    conversationMemory.length = 1;

    // Clear chat UI
    chatContainer.innerHTML = "";

    // Add system message to UI
    addSystemMessageToChat();

    console.log("Conversation history cleared");
    statusElement.textContent = "History cleared";

    // Focus input
    messageInput.focus();
  } catch (error) {
    console.error("Failed to clear conversation history:", error);
  }
}

/*
   Add system message to chat
*/
function addSystemMessageToChat() {
  // Check if system message already exists
  const existingSystem = document.getElementById("systemMessage");
  if (existingSystem) {
    existingSystem.remove();
  }

  // Create and prepend system message
  const systemMsg = createSystemMessage();
  chatContainer.insertBefore(systemMsg, chatContainer.firstChild);
}

/*
   Delete all history (current + archive)
*/
function deleteAllHistory() {
  try {
    showProgress("Deleting all history...");

    updateProgress(40, "Clearing storage...");
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(STORAGE_KEY_ARCHIVE);

    updateProgress(70, "Clearing conversation...");
    clearConversationHistory();

    console.log("All conversation history deleted");
    statusElement.textContent = "All history deleted";
    hideProgress();
  } catch (error) {
    console.error("Failed to delete all history:", error);
    hideProgress();
  }
}

/*
   Show history list modal
*/
function showHistoryListModal() {
  try {
    showProgress("Loading history list...");

    const historyModal = document.getElementById('historyModal');
    const historyList = document.getElementById('historyList');

    // Get archive
    const savedArchive = localStorage.getItem(STORAGE_KEY_ARCHIVE);
    let archive = savedArchive ? JSON.parse(savedArchive) : [];

    // Add current conversation if it has messages
    const currentSaved = localStorage.getItem(STORAGE_KEY);
    if (currentSaved) {
      const current = JSON.parse(currentSaved);
      if (current.chatMessages && current.chatMessages.length > 0) {
        archive.unshift({
          ...current,
          isCurrent: true
        });
      }
    }

    updateProgress(50, "Rendering history...");

    // Clear existing list
    historyList.innerHTML = '';

    if (archive.length === 0) {
      historyList.innerHTML = `
        <div class="history-empty">

function deleteConversation(timestamp, isCurrent = false) {
  try {
    // Confirm deletion
    if (!confirm("Are you sure you want to delete this conversation? This action cannot be undone.")) {
      return;
    }

    showProgress("Deleting conversation...");
    console.log("🗑️ Deleting conversation:", timestamp);

    updateProgress(30, "Removing from archive...");

    if (isCurrent) {
      // Delete current conversation
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(STORAGE_KEY_CONVERSATION_CONFIG);

      // Clear the UI and memory
      clearConversationHistory();

      console.log("✅ Current conversation deleted");
    } else {
      // Delete from archive
      const savedArchive = localStorage.getItem(STORAGE_KEY_ARCHIVE);
      if (savedArchive) {
        let archive = JSON.parse(savedArchive);

        // Filter out the conversation with matching timestamp
        const originalLength = archive.length;
        archive = archive.filter(conv => conv.timestamp !== timestamp);

        if (archive.length < originalLength) {
          // Save updated archive
          localStorage.setItem(STORAGE_KEY_ARCHIVE, JSON.stringify(archive));
          console.log("✅ Conversation deleted from archive");
        } else {
          console.warn("⚠️ Conversation not found in archive");
        }
      }
    }

    updateProgress(70, "Refreshing list...");

    // Refresh the history list
    setTimeout(() => {
      showHistoryListModal();
    }, 300);

    hideProgress();
  } catch (error) {
    console.error("Failed to delete conversation:", error);
    hideProgress();
    alert("Failed to delete conversation: " + error.message);
  }
}

/* ============================================================
   OLLAMA CALL
============================================================ */

function sanitizeChatMessages(messages) {
  if (!Array.isArray(messages)) {
    return [];
  }

  return messages
    .filter((msg) => msg && typeof msg === 'object')
    .map((msg) => {
      const safeMessage = { ...msg };

      if (!safeMessage.role) {
        return null;
      }

      if (safeMessage.content === undefined || safeMessage.content === null) {
        safeMessage.content = '';
      }

      if (typeof safeMessage.content !== 'string') {
        safeMessage.content = JSON.stringify(safeMessage.content);
      }

      if (safeMessage.tool_calls !== undefined && !Array.isArray(safeMessage.tool_calls)) {
        safeMessage.tool_calls = [];
      }

      return safeMessage;
    })
    .filter(Boolean);
}

async function callOllama(
  messages,
  options = {}
) {

  const model = options.model || MODEL;
  const isStreaming = options.stream ?? false;
  const useTools = options.tools ?? false;

  // Only use cache for non-streaming requests
  const safeMessages = sanitizeChatMessages(messages);

  if (!isStreaming) {
    try {
      // Show brief progress for cache check
      showProgress("Checking cache...");

      // Generate cache key
      const cacheKey = await OllamaCache.generateCacheKey(model, safeMessages, options);

      // Try to get cached response
      const cachedResponse = await OllamaCache.get(cacheKey);

      if (cachedResponse) {
        // Cache hit - hide progress and return
        hideProgress();
        // Return cached response in the same format as fetch would
        return new Response(JSON.stringify(cachedResponse), {
          status: 200,
          headers: { 'Content-Type': 'application/json' }
        });
      }

      // Cache miss - progress will continue in the fetch section

      // Cache miss - fetch from Ollama
      const requestBody = {
        model: model,
        messages: safeMessages,
        stream: false,
        think: options.think ?? false
      };

      // Add tools if requested
      if (useTools && toolSchemas.length > 0) {
        requestBody.tools = toolSchemas;
      }

      // Update progress message for fetch
      updateProgress(20, `Fetching from Ollama (${model})...`);

      try {
        const response = await fetch(
          OLLAMA_URL,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              ...(DEEPSEEK_API_KEY ? { "Authorization": `Bearer ${DEEPSEEK_API_KEY}` } : {})
            },

            body: JSON.stringify(requestBody)
          }
        );

        if (!response.ok) {
          hideProgress();
          const errorText = await response.text();
          throw new Error(
            `Ollama HTTP ${response.status}: ${errorText}`
          );
        }

        updateProgress(95, "Processing response...");

        // Clone response to cache it (since response body can only be read once)
        const responseClone = response.clone();
        const data = await responseClone.json();

        // Cache the response asynchronously (don't wait for it)
        OllamaCache.set(cacheKey, data).catch(err => {
          console.warn('Failed to cache response:', err);
        });

        hideProgress();
        return response;
      } catch (error) {
        hideProgress();
        throw error;
      }

    } catch (cacheError) {
      console.warn('Cache error, falling back to direct fetch:', cacheError);
      // Fall through to normal fetch
    }
  }

  // Streaming requests or cache error fallback
  const requestBody = {
    model: model,
    messages: safeMessages,
    stream: isStreaming,
    /*
      For the explanation agent we use thinking=false.
      This makes the output easier to feed into the extractor.
    */
    think: options.think ?? false
  };

  // Add tools if requested
  if (useTools && toolSchemas.length > 0) {
    requestBody.tools = toolSchemas;
  }

  // Show progress bar for streaming requests
  if (isStreaming) {
    showProgress(`Streaming from Ollama (${model})...`);
  }

  try {
    const response = await fetch(
      OLLAMA_URL,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          ...(DEEPSEEK_API_KEY ? { "Authorization": `Bearer ${DEEPSEEK_API_KEY}` } : {})
        },

        body: JSON.stringify(requestBody)
      }
    );


    if (!response.ok) {
      if (isStreaming) {
        hideProgress();
      }
      const errorText =
        await response.text();

      throw new Error(
        `Ollama HTTP ${response.status}: ${errorText}`
      );
    }


    // For streaming, we'll hide progress once streaming starts
    // This is handled in the caller where stream is consumed
    return response;
  } catch (error) {
    if (isStreaming) {
      hideProgress();
    }
    throw error;
  }
}

============================================================ */

async function generateExplanation(
  userQuestion,
  assistantDiv
) {

  /*
     IMPORTANT:

     We add the USER QUESTION to the explanation memory.
  */

  conversationMemory.push({
    role: "user",
    content: userQuestion
  });


  const response =
    await callOllama(
      conversationMemory,
      {
        model: MODEL,
        think: true,
        stream: true
      }
    );


  const reader =
    response.body.getReader();

  const decoder =
    new TextDecoder();


  let buffer = "";
  let fullResponse = "";
  let thinkingResponse = "";
  let inThinkTag = false;


  // Create thinking section
  let thinkingSection = null;
  let thinkingContent = null;

  const answerLabel =
    document.createElement("div");

  answerLabel.className =
    "answer-label";

  answerLabel.textContent =
    "Answer:";

  assistantDiv.appendChild(
    answerLabel
  );


  const answerContent =
    document.createElement("div");

  answerContent.className =
    "answer-content";

  assistantDiv.appendChild(
    answerContent
  );

  // Move cursor from assistantDiv to answerContent (so it moves with text)
  const cursor = assistantDiv.querySelector('[data-cursor="true"]');
  if (cursor) {
    cursor.remove();
    answerContent.appendChild(cursor);
  }


  while (true) {

    const {
      done,
      value
    } = await reader.read();


    if (done) {
      break;
    }

    // Hide progress on first chunk received
    if (buffer === "") {
      hideProgress();
    }

    buffer +=
      decoder.decode(
        value,
        {
          stream: true
        }
      );


    const lines =
      buffer.split("\n");

    buffer =
      lines.pop();


    for (const line of lines) {

      if (!line.trim()) {
        continue;
      }


      let data;

      try {
        data =
          JSON.parse(line);
      } catch {
        continue;
      }

      // Debug: Log the data structure (only first few times)
      if (!window.debugLogged || window.debugLogged < 3) {
        console.log("🔍 Stream data:", data);
        window.debugLogged = (window.debugLogged || 0) + 1;
      }

      // Handle thinking content
      const thinking = data.message?.thinking || "";
      if (thinking) {
        if (!thinkingSection) {
          // Create thinking section on first thinking content
          thinkingSection = document.createElement("div");
          thinkingSection.className = "thinking-section";

          const thinkingLabel = document.createElement("div");
          thinkingLabel.className = "thinking-label";
          thinkingLabel.textContent = "💭 Thinking:";
          thinkingSection.appendChild(thinkingLabel);

          thinkingContent = document.createElement("div");
          thinkingContent.className = "thinking-content";
          thinkingSection.appendChild(thinkingContent);

          // Insert before answer label
          assistantDiv.insertBefore(thinkingSection, answerLabel);
        }

        thinkingResponse += thinking;
        thinkingContent.textContent = thinkingResponse;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      const content =
        data.message?.content || "";


      if (content) {
        // Check for <think> tags in content (DeepSeek R1 style)
        let processedContent = content;

        // If we find a <think> tag, extract thinking content
        if (content.includes('<think>')) {
          const thinkMatch = content.match(/<think>([\s\S]*?)(?:<\/think>|$)/);
          if (thinkMatch) {
            const thinkText = thinkMatch[1];

            // Create thinking section if not exists
            if (!thinkingSection) {
              thinkingSection = document.createElement("div");
              thinkingSection.className = "thinking-section";

              const thinkingLabel = document.createElement("div");
              thinkingLabel.className = "thinking-label";
              thinkingLabel.textContent = "💭 Thinking:";
              thinkingSection.appendChild(thinkingLabel);

              thinkingContent = document.createElement("div");
              thinkingContent.className = "thinking-content";
              thinkingSection.appendChild(thinkingContent);

              assistantDiv.insertBefore(thinkingSection, answerLabel);
            }

            thinkingResponse += thinkText;
            thinkingContent.textContent = thinkingResponse;
            inThinkTag = !content.includes('</think>');

            // Remove <think> tags from display content
            processedContent = content.replace(/<think>[\s\S]*?(?:<\/think>)?/g, '');
          }
        } else if (inThinkTag) {
          // We're still inside a <think> tag from previous chunk
          if (content.includes('</think>')) {
            const endThinkMatch = content.match(/([\s\S]*?)<\/think>/);
            if (endThinkMatch) {
              thinkingResponse += endThinkMatch[1];
              thinkingContent.textContent = thinkingResponse;
              processedContent = content.replace(/[\s\S]*?<\/think>/, '');
              inThinkTag = false;
            }
          } else {
            // Still in think tag, add to thinking
            thinkingResponse += content;
            thinkingContent.textContent = thinkingResponse;
            processedContent = '';
          }
        }

        fullResponse +=
          processedContent;

        // Update text content and keep cursor at the end
        const cursorElement = answerContent.querySelector('[data-cursor="true"]');
        if (cursorElement) {
          cursorElement.remove();
        }
        answerContent.textContent = fullResponse;
        if (cursorElement) {
          answerContent.appendChild(cursorElement);
        }

        chatContainer.scrollTop =
          chatContainer.scrollHeight;
      }
    }
  }


  // Remove cursor when streaming is complete
  const cursorElement = answerContent.querySelector('[data-cursor="true"]');
  if (cursorElement) {
    cursorElement.remove();
  }

  /*
     Save ONLY the completed explanation.
  */

  conversationMemory.push({
    role: "assistant",
    content: fullResponse
  });

  // Add like buttons to the message
  const messageId = assistantDiv.dataset.messageId;
  if (messageId) {
    createLikeButtons(assistantDiv, messageId);
  }

  return fullResponse;
}


/* ============================================================
   TOOL CALLING HANDLER
============================================================ */

async function handleToolCalls(messages, maxIterations = 3, assistantDiv = null) {
  let iteration = 0;
  const toolsUsed = [];

  while (iteration < maxIterations) {
    iteration++;

    // Call Ollama with tools
    const response = await callOllama(messages, {
      model: MODEL,
      think: false,
      stream: false,
      tools: true
    });

    let data;
    try {
      data = await response.json();
    } catch (error) {
      console.error('Invalid Ollama response payload:', error);
      data = {};
    }

    const message = data && typeof data.message === 'object' && data.message !== null
      ? data.message
      : { role: 'assistant', content: data?.content ?? '' };

    console.log(`Iteration ${iteration}:`, message);
    // Add assistant's response to messages
    messages.push(message);

    // Check if there are tool calls
    const toolCalls = Array.isArray(message.tool_calls) ? message.tool_calls : [];

    if (toolCalls.length === 0) {
      // No more tool calls, return the final response with tools used info
      return {
        content: message.content ?? '',
        toolsUsed: toolsUsed,
        assistantDiv: assistantDiv
      };
    }

    // Execute each tool call
    console.log(`🔧 Executing ${toolCalls.length} tool(s)...`);
    statusElement.textContent = `Executing ${toolCalls.length} tool(s)...`;
    showProgress(`Executing ${toolCalls.length} tool(s)...`);

    for (let i = 0; i < toolCalls.length; i++) {
      const call = toolCalls[i];
      const toolName = call.function.name;
      const toolArgs = call.function.arguments;

      toolsUsed.push(toolName);
      console.log(`  → ${toolName}:`, toolArgs);

      updateProgress(
        20 + (i / toolCalls.length) * 60,
        `Executing ${toolName} (${i + 1}/${toolCalls.length})...`
      );

      try {
        // Execute the tool
        const toolFunction = tools[toolName];
        if (!toolFunction) {
          throw new Error(`Tool not found: ${toolName}`);
        }

        const toolResult = await toolFunction(toolArgs);
        console.log(`  ✓ Result:`, toolResult);

        // Add tool result to messages
        messages.push({
          role: 'tool',
          content: toolResult
        });
      } catch (error) {
        console.error(`  ✗ Error:`, error.message);

        // Add error as tool result
        messages.push({
          role: 'tool',
          content: JSON.stringify({ error: error.message })
        });
      }
    }

    hideProgress();
  }

  // Max iterations reached
  return {
    content: "Maximum tool iterations reached. Please try rephrasing your question.",
    toolsUsed: toolsUsed
  };
}

/**

 * Creates a high-quality, context-aware reformulation of the user's message

async function paraphraseUserInput(userInput) {
  try {
    statusElement.textContent = "Paraphrasing your input...";

    // Create a context-aware paraphrasing prompt
    const contextAwarePrompt = `You are a text paraphrasing assistant with explicit context awareness. Your task is to rephrase the user's input while maintaining its core meaning, intent, and any contextual references.

CRITICAL INSTRUCTIONS:
1. Preserve the original intent and meaning completely
2. Maintain any technical terms, proper nouns, or specific references
3. Keep the paraphrase concise and natural
4. If the input references previous conversation context, acknowledge that in your paraphrase
5. Improve clarity if the original is ambiguous
6. Do NOT add new information not present in the original
7. Output ONLY the paraphrased text, nothing else

Original Input: "${userInput}"

Paraphrased Version:`;

    const paraphraseMessages = [
      {
        role: "system",
        content: contextAwarePrompt
      },
      {
        role: "user",
        content: userInput
      }
    ];

    // Call Ollama with deepseek-r1:8b for paraphrasing (no streaming, no tools)
    const response = await callOllama(paraphraseMessages, {
      model: MODEL,
      think: false,
      stream: false,
      tools: false
    });

    const data = await response.json();
    const paraphrasedText = data.message?.content?.trim() || userInput;

    console.log("🔄 Original Input:", userInput);
    console.log("✨ Paraphrased Input:", paraphrasedText);

    return paraphrasedText;
  } catch (error) {
    console.error("Paraphrasing failed, using original input:", error);
    // Fallback to original input if paraphrasing fails
    return userInput;
  }
}

      });

      // Add like buttons
      const messageId = assistantDiv.dataset.messageId;
      if (messageId) {
        createLikeButtons(assistantDiv, messageId);
      }

      statusElement.textContent = "Ready";

    } else {
      // Original flow without tools

      /*
         STEP 1

         Generate normal explanation using the paraphrased question.

         THIS MUST NOT use the Formula Extractor prompt.
      */

      const explanation =await generateExplanation(
          paraphrasedQuestion,
          assistantDiv
        );


    console.log("========== COMPLETED EXPLANATION =========="
    );

    console.log(explanation);


    if (
      !explanation.trim()
    ) {

      throw new Error(
        "Explanation agent returned no content."
      );
    }





    statusElement.textContent="Ready";

    } // End of else block (standard mode)

  } catch (error) {

    console.error(
      error
    );


    const errorDiv =
      document.createElement(
        "div"
      );


    errorDiv.className =
      "error-display";


    errorDiv.textContent =
      error.message;


    assistantDiv.appendChild(
      errorDiv
    );


    statusElement.textContent =
      "Error";
  }


  isProcessing =
    false;


  sendButton.disabled =
    false;


  messageInput.focus();

  // Save conversation history after each message
  saveConversationHistory();
}

function addUserMessage(
  text,
  originalText = null
) {

  const div =
    document.createElement(
      "div"
    );


  div.className =
    "message user";

  // If we have both original and paraphrased text, show both
  if (originalText && originalText !== text) {
    const originalDiv = document.createElement("div");
    originalDiv.style.fontSize = "12px";
    originalDiv.style.opacity = "0.7";
    originalDiv.style.marginBottom = "6px";
    originalDiv.style.fontStyle = "italic";
    originalDiv.textContent = `Original: ${originalText}`;

    const paraphrasedDiv = document.createElement("div");
    paraphrasedDiv.textContent = text;

    const indicator = document.createElement("div");
    indicator.style.fontSize = "11px";
    indicator.style.marginTop = "4px";
    indicator.style.opacity = "0.6";
    indicator.textContent = "🔄 Auto-paraphrased";

    div.appendChild(originalDiv);
    div.appendChild(paraphrasedDiv);
    div.appendChild(indicator);
  } else {
    div.textContent = text;
  }


  chatContainer.appendChild(
    div
  );


  chatContainer.scrollTop =
    chatContainer.scrollHeight;
}

function toggleConfigScope(messageDiv) {
  const isCurrentlyConversationSpecific = hasConversationConfig();

  if (isCurrentlyConversationSpecific) {
    // Revert to global
    if (confirm("Revert to global configuration? This conversation will use the global agent settings.")) {
      clearConversationAgentConfig();

      // Update conversation memory
      conversationMemory[0] = {
        role: "system",
        content: getCombinedSystemPrompt()
      };

      // Rebuild system message
      addSystemMessageToChat();
      statusElement.textContent = "Reverted to global configuration";
    }
  } else {
    // Create conversation-specific config by copying global
    const newConfig = { ...globalAgentConfig };
    saveConversationAgentConfig(newConfig);

    // Update conversation memory
    conversationMemory[0] = {
      role: "system",
      content: getCombinedSystemPrompt()
    };

    // Rebuild system message
    addSystemMessageToChat();
    statusElement.textContent = "Created conversation-specific configuration";
  }
}

function toggleSystemEditor(messageDiv, show) {
  const content = messageDiv.querySelector("#systemContent");
  const editor = messageDiv.querySelector("#systemEditor");
  const buttons = messageDiv.querySelectorAll(".system-btn");
  const editBtn = buttons[buttons.length - 1]; // Last button is edit

  if (show === undefined) {
    show = !editor.classList.contains("active");
  }

  if (show) {
    content.style.display = "none";
    editor.classList.add("active");
    editBtn.textContent = "👁️ View";
  } else {
    content.style.display = "block";
    editor.classList.remove("active");
    editBtn.textContent = "✏️ Edit";
  }
}

function saveSystemFromInline(messageDiv) {
  const soulTextarea = document.getElementById("systemSoulEdit");
  const instructionsTextarea = document.getElementById("systemInstructionsEdit");

  const activeConfig = getActiveAgentConfig();
  const newConfig = {
    ...activeConfig,
    soul: soulTextarea.value.trim(),
    systemInstructions: instructionsTextarea.value.trim()
  };

  // Always save as conversation-specific when editing inline
  const isConversationSpecific = true;

  if (saveAgentConfig(newConfig, isConversationSpecific)) {
    // Update the system message in conversation memory
    conversationMemory[0] = {
      role: "system",
      content: getCombinedSystemPrompt()
    };

    // Update the display
    updateSystemMessageDisplay();
    toggleSystemEditor(messageDiv, false);

    const scope = hasConversationConfig() ? "conversation-specific" : "global";
    statusElement.textContent = `Agent configuration updated (${scope})`;
    console.log("✅ System instruction updated from inline editor");
  } else {
    alert("Failed to save agent configuration");
  }
}

/* ============================================================
   GRID RESIZE FUNCTIONALITY
============================================================ */

const resizeHandle = document.getElementById('resizeHandle');
let isResizing = false;
let startY = 0;
let startHeight = 0;

resizeHandle.addEventListener('mousedown', (e) => {
  isResizing = true;
  startY = e.clientY;
  startHeight = gridSection.offsetHeight;
  document.body.style.cursor = 'ns-resize';
  document.body.style.userSelect = 'none';
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;

  const deltaY = e.clientY - startY;
  const newHeight = startHeight + deltaY;

  // Constrain height between 100px and 70vh
  const minHeight = 100;
  const maxHeight = window.innerHeight * 0.7;
  const constrainedHeight = Math.min(Math.max(newHeight, minHeight), maxHeight);

  gridSection.style.maxHeight = `${constrainedHeight}px`;
});

document.addEventListener('mouseup', () => {
  if (isResizing) {
    isResizing = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
});
